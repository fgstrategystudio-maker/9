name: Keep Alive — Supabase + Dashboard

# OBIETTIVO: impedire che i progetti Supabase free vadano in pausa (7 giorni di
# inattività) e accorgersene SUBITO se il keep-alive smette di funzionare.
#
# Principi di robustezza (perché prima falliva in silenzio):
#  1. Cadenza fitta: ogni 6 ore. Anche se GitHub salta/ritarda qualche run
#     (lo scheduler è "best-effort"), il gap tra due ping riusciti resta molto
#     sotto i 7 giorni.
#  2. Verifica reale: ogni ping controlla il codice HTTP. Se il progetto non
#     risponde (DNS/timeout/000 oppure 5xx = in pausa) il job FALLISCE.
#  3. Niente errori nascosti: il vecchio `continue-on-error` rendeva il workflow
#     sempre verde. Ora un ping fallito = run rosso.
#  4. Allarme: se un ping critico fallisce, apre/aggiorna una issue su GitHub,
#     così ricevi una mail PRIMA che il progetto vada in pausa.

on:
  schedule:
    # Ogni 6 ore. Minuto :17 per evitare il picco dell'ora tonda (quando GitHub
    # ritarda di più i cron). => 4 ping/giorno.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping (verificato — DEVE rispondere 200)
        id: supabase
        run: |
          set -uo pipefail
          fail=0

          # Pinghiamo l'endpoint /api/db dell'app, che esegue una LETTURA REALE
          # dal database con la service key lato server => HTTP 200 e attività
          # vera sul DB. (L'endpoint Supabase /rest/v1 con la chiave anon dava
          # 401: respinto dal gateway senza toccare il DB, NON teneva vivo nulla.)
          ping_app() {
            local name="$1" url="$2" code
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 4 --retry-delay 5 --retry-all-errors --max-time 25 \
              -X POST "$url" -H "Content-Type: application/json" -d '{"action":"load"}')
            echo "$name ($url) → HTTP $code"
            if [ "$code" = "200" ]; then return 0; fi
            echo "::error::$name: atteso 200, ricevuto $code — il keep-alive NON sta registrando attività sul DB."
            return 1
          }

          # Freelance/Medical condividono il progetto Supabase ehmfwkmtbfmdxcddfyzd:
          # questo repo è il guardiano PRINCIPALE di quel DB => bloccante.
          ping_app "Freelance/Medical (DB ehmfwkmtbfmdxcddfyzd)" "https://freelance-dashboard-j1ay.vercel.app/api/db" || fail=1
          # Famiglia (DB hukliyruwvwlkubclgfr): già coperto dal suo workflow + dal
          # monitor esterno => qui solo informativo, non fa fallire il job.
          ping_app "Famiglia (DB hukliyruwvwlkubclgfr)" "https://famiglia-dashboard.vercel.app/api/db" || echo "(famiglia best-effort, non blocca questo repo)"

          exit "$fail"

      - name: Ping dashboard Vercel (best-effort, non blocca)
        if: always()
        run: |
          for app in \
            "https://famiglia-dashboard.vercel.app/" \
            "https://freelance-dashboard-j1ay.vercel.app/" \
            "https://medical-dashboard-nvcc.vercel.app/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$app" || echo "000")
            echo "$app → HTTP $code"
          done

      - name: Allarme se un ping è fallito
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `⚠️ Il **keep-alive** ha rilevato un progetto Supabase che non risponde.`,
              ``,
              `Quando: ${new Date().toISOString()}`,
              `Log del run: ${run}`,
              ``,
              `Possibili cause: progetto andato in pausa, chiave anon scaduta, o Supabase down.`,
              `Azione: apri la dashboard Supabase, riattiva il progetto se in pausa e controlla i log qui sopra.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'keep-alive',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: '⚠️ Keep-alive Supabase FALLITO', body,
                labels: ['keep-alive'],
              });
            }
