name: Keep Alive — Ping Dashboard Vercel + Supabase

on:
  schedule:
    # Ogni giorno alle 9:00 ora italiana (07:00 UTC in estate, 08:00 in inverno)
    - cron: "0 7 * * *"
  workflow_dispatch: # permette di eseguirlo manualmente dal sito GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Freelance Dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://freelance-dashboard-j1ay.vercel.app/)
          echo "Freelance Dashboard → HTTP $STATUS"

      - name: Ping Medical Dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://medical-dashboard-nvcc.vercel.app/)
          echo "Medical Dashboard → HTTP $STATUS"

      - name: Ping Famiglia Dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://famiglia-dashboard.vercel.app/)
          echo "Famiglia Dashboard → HTTP $STATUS"

      - name: Ping Supabase — Dashboard Mamma e Papa
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hukliyruwvwlkubclgfr.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1a2xpeXJ1d3Z3bGt1YmNsZ2ZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDA5MDksImV4cCI6MjA5NDg3NjkwOX0.GUC5GLBLP94D_vXrZN0_TES6ptAeDCme4fo4uwYtl_k" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1a2xpeXJ1d3Z3bGt1YmNsZ2ZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDA5MDksImV4cCI6MjA5NDg3NjkwOX0.GUC5GLBLP94D_vXrZN0_TES6ptAeDCme4fo4uwYtl_k")
