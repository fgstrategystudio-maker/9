name: Diag freelance cloud (temporaneo)
# run 2 — dopo configurazione env vars su Vercel

# Workflow diagnostico TEMPORANEO: verifica se l'endpoint /api/db della dashboard
# freelance raggiunge davvero Supabase e quali chiavi contiene il cloud.
# NON stampa i valori (dati finanziari), solo stato HTTP, chiavi e dimensioni.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-freelance.yml']
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Stato app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://freelance-dashboard-j1ay.vercel.app/" || echo "000")
          echo "Homepage → HTTP $code"

      - name: /api/db load
        run: |
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 30 \
            -X POST "https://freelance-dashboard-j1ay.vercel.app/api/db" \
            -H "Content-Type: application/json" -d '{"action":"load"}')
          echo "POST /api/db {action:load} → HTTP $code"
          echo "--- struttura risposta (senza valori) ---"
          python3 - <<'EOF'
          import json
          try:
              raw = open('/tmp/r.json','rb').read()
          except Exception as e:
              print("no file:", e); raise SystemExit
          print("bytes:", len(raw))
          try:
              d = json.loads(raw)
          except Exception as e:
              print("NON-JSON (probabile errore):", raw[:300]); raise SystemExit
          res = d.get('result') if isinstance(d, dict) else d
          if isinstance(d, dict) and 'error' in d:
              print("ERROR field:", str(d['error'])[:300])
          if isinstance(res, list):
              print("righe nel cloud:", len(res))
              for row in res:
                  k = row.get('key'); v = row.get('value')
                  vlen = len(json.dumps(v)) if v is not None else 0
                  n = len(v) if isinstance(v, list) else ('dict' if isinstance(v, dict) else type(v).__name__)
                  print(f"  key={k!r}  bytes={vlen}  elementi={n}")
          else:
              print("result type:", type(res).__name__, str(res)[:200])
          EOF
