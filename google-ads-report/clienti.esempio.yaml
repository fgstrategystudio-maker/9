# Configurazione dei clienti.
#
# ATTENZIONE: il repository è pubblico. NON inserire qui nomi, ID o email reali.
# Copia questo file in "clienti.yaml" (ignorato da git) per le prove in locale e,
# per GitHub Actions, incolla il contenuto completo nel Secret CLIENTI_YAML.

agenzia:
  nome: Francesco Gizzi
  sito: https://francescogizzi.com
  email_interna: tu@esempio.it   # dove arrivano report interno e report da inoltrare
  colore: "#173b7a"              # colore dell'intestazione del report cliente

clienti:
  # Il tuo account: solo report interno (report_cliente vuoto).
  - nome: Francesco Gizzi – lead generation
    customer_id: "111-111-1111"
    obiettivo: lead
    budget_mensile: 600
    cpa_target: 40
    report_cliente: []

  # Cliente lead generation: report cliente a inizio mese, inviato a te da inoltrare.
  - nome: Studio Esempio
    customer_id: "222-222-2222"
    obiettivo: lead              # lead | ecommerce | negozio
    budget_mensile: 1500         # se assente, viene stimato dai budget giornalieri delle campagne
    cpa_target: 35
    email: [titolare@esempio.it]
    invio_automatico: false      # true = il report parte direttamente al cliente (tu in copia nascosta)
    report_cliente: [inizio]     # momenti in cui ricevere il report: inizio, meta, fine
    note: Picco stagionale a settembre; il lead più prezioso è la richiesta di preventivo.

  # Cliente e-commerce: report cliente a inizio e metà mese.
  - nome: Negozio Esempio
    customer_id: "333-333-3333"
    obiettivo: ecommerce
    budget_mensile: 4000
    roas_target: 5
    email: [marketing@esempio.it, titolare@esempio.it]
    invio_automatico: false
    report_cliente: [inizio, meta]

  # Locale fisico (ristorante, negozio): il risultato sono le visite al negozio.
  # Se Google non le misura sull'account, vengono stimate dalle indicazioni stradali.
  # Il report cliente è un PDF: layout "advisory" (predefinito) o "grano".
  - nome: Ristorante Esempio
    customer_id: "444-444-4444"
    obiettivo: negozio
    descrizione: Via Roma 1, Roma          # sotto il nome del locale
    layout: grano                          # copertina centrata e sezioni numerate
    colore: "#8b1a1a"                      # titoli e intestazioni delle tabelle
    colore_titoletti: "#c0392b"            # sottotitoli (solo layout grano)
    fasce_tabella:                         # fasce della tabella orari (solo layout grano)
      - ["Pranzo (dalle 11 alle 15)", 11, 15]
      - ["Sera (dalle 19 alle 23)", 19, 23]
    quota_visite_indicazioni: 0.27         # visite stimate = 27% delle indicazioni stradali
    fasce: [[12, 14], [19, 22]]            # fasce di servizio evidenziate nel grafico orario
    coperti_per_visita: 2.5
    scontrino_medio: 18                    # spesa media a persona
    compenso: {tipo: fisso, importo: 500, margine: 0.40}   # mostra margine, ROI e ROAS
    report_cliente: [inizio]

  # Gruppo con più locali (un account Google Ads per locale): un unico report.
  - nome: Gruppo Esempio
    obiettivo: negozio
    colore: "#c9a25a"
    report_n: {mese: "2026-09", numero: 3}  # settembre 2026 = report N.3, poi si numera da solo
    target_costo_visita: 7.50               # obiettivo contrattuale per visita
    sottostima_visite: 0.30                 # visite che Google registra in ritardo (stima consolidata)
    # fee = percentuale del fatturato attribuibile (visite × coperti × scontrino);
    # base mese_precedente = visite del mese prima, a dati consolidati; base mese = visite del mese chiuso.
    compenso: {tipo: percentuale, percentuale: 0.01, base: mese_precedente}
    fatto: Pulizia dei termini di ricerca a inizio mese.   # facoltativo, testo del mese
    prossimi_passi: ["Mappare i competitor: completare la mappatura con il vostro aiuto."]
    report_cliente: [inizio]
    locali:
      - nome: Locale Uno
        customer_id: "555-555-5555"
        descrizione: Sushi · Roma
        fasce: [[12, 14], [18, 21]]
        coperti_per_visita: 2.5
        scontrino_medio: 28.70
      - nome: Locale Due
        customer_id: "666-666-6666"
        descrizione: Izakaya · Milano
        fasce: [[18, 23]]
        coperti_per_visita: 2.5
        scontrino_medio: 30
        contratto_dal: "2026-10-17"     # per la fee le visite contano da questa data
        compenso_fisso: 325             # fisso mensile, da sommare alla fee
        inps_fisso: 0.04                # + 4% INPS sul fisso
